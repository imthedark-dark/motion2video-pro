name: Verify or publish a reviewed Release draft
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify existing bytes, or publish an already-staged draft
        type: choice
        options: [verify, publish-draft]
        default: verify
      audit_run_id:
        description: Successful build-and-audit run for the exact tagged source (publish only)
        type: string
      signer_sha256:
        description: Independently trusted production certificate SHA-256 (publish only)
        type: string
      native_checks_confirmed:
        description: Maintainer completed native and physical acceptance on these exact bytes
        type: boolean
        default: false
      tag:
        description: Existing immutable release tag
        required: true
        default: v1.4.1
        type: string
      apk:
        description: Existing Release asset filename (verify mode)
        required: true
        default: Motion2Video-1.4.1-Dark.apk
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: inputs.mode == 'verify'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download and verify Release bytes (no publishing privileges)
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          APK_NAME: ${{ inputs.apk }}
          RELEASE_REPO: ${{ github.repository }}
        run: python3 tools/verify_release.py --release "$RELEASE_TAG" --apk "$APK_NAME" --repo "$RELEASE_REPO"
  publish:
    if: inputs.mode == 'publish-draft'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-${{ inputs.tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      AUDIT_RUN: ${{ inputs.audit_run_id }}
      EXPECTED_SIGNER: ${{ inputs.signer_sha256 }}
      NATIVE_CHECKS: ${{ inputs.native_checks_confirmed }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require draft, tagged source, green audit and maintainer native acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json,os,re,subprocess
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/'+path],text=True))
          tag=os.environ['RELEASE_TAG'];run=os.environ['AUDIT_RUN']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',tag) or not re.fullmatch(r'[0-9]+',run) or not re.fullmatch(r'[a-fA-F0-9]{64}',os.environ['EXPECTED_SIGNER']) or os.environ['NATIVE_CHECKS']!='true':raise SystemExit('Valid tag, audit run, signer and completed native acceptance required')
          release=api('releases/tags/'+tag)
          name='Motion2Video-'+tag[1:]+'-Dark-release.apk'
          if not release['draft'] or {x['name'] for x in release['assets']}!={name,'SHA256SUMS.txt'}:raise SystemExit('Expected an unpublished draft with only signed APK and checksums; never overwrite a published release')
          obj=api('git/ref/tags/'+tag)['object']
          for _ in range(5):
              if obj['type']=='commit':break
              if obj['type']!='tag':raise SystemExit('Unexpected tag target')
              obj=api('git/tags/'+obj['sha'])['object']
          if obj['type']!='commit':raise SystemExit('Tag must resolve to a commit')
          audit=api('actions/runs/'+run);workflow=api('actions/workflows/build.yml')
          if audit['workflow_id']!=workflow['id'] or audit['head_sha']!=obj['sha'] or audit['conclusion']!='success' or audit['event'] not in ('push','workflow_dispatch'):raise SystemExit('Successful build/audit of exact tagged source required')
          jobs=api('actions/runs/'+run+'/jobs?per_page=100')['jobs']
          if not all(any(j['name']==name and j['conclusion']=='success' for j in jobs) for name in ('build','dependency-check')):raise SystemExit('Both build and dependency-check jobs must pass')
          PYCODE
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "build-tools;35.0.0"
      - name: Verify exact draft APK before making anything public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate="$RUNNER_TEMP/release-candidate"
          mkdir -p "$candidate"
          gh release download "$RELEASE_TAG" --dir "$candidate"
          python3 tools/verify_publish_candidate.py --directory "$candidate" --tag "$RELEASE_TAG" --signer "$EXPECTED_SIGNER"
      - name: Publish the existing verified draft (no rebuild, upload or overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false
