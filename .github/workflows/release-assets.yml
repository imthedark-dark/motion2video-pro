name: Attach verified release APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag containing the signed APK
        required: true
        default: v1.4.1
        type: string
permissions:
  contents: write
concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate tag input
        run: |
          python3 - <<'PY'
          import os,re
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',os.environ['RELEASE_TAG']):
              raise SystemExit('Expected a semantic release tag such as v1.4.1')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Verify signed distributable bytes
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,zipfile
          name='Motion2Video-'+os.environ['RELEASE_TAG'][1:]+'-Dark.apk'
          apk=pathlib.Path('downloads')/name
          sums={n:d for d,n in (line.split() for line in pathlib.Path('downloads/SHA256SUMS.txt').read_text().splitlines())}
          if hashlib.sha256(apk.read_bytes()).hexdigest()!=sums.get(name):
              raise SystemExit('APK checksum mismatch')
          with zipfile.ZipFile(apk) as z:
              if z.testzip() is not None or not {'AndroidManifest.xml','classes.dex'}.issubset(z.namelist()):
                  raise SystemExit('Invalid APK')
          print('Verified existing signed APK; no rebuild or signing-key access.')
          PY
      - name: Attach exact APK and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null
          apk="Motion2Video-${RELEASE_TAG#v}-Dark.apk"
          mkdir -p "$RUNNER_TEMP/current-assets"
          for name in "$apk" SHA256SUMS.txt; do
            if gh release download "$RELEASE_TAG" --pattern "$name" --dir "$RUNNER_TEMP/current-assets"; then
              cmp "downloads/$name" "$RUNNER_TEMP/current-assets/$name"
            else
              gh release upload "$RELEASE_TAG" "downloads/$name"
            fi
          done
      - name: Verify uploaded assets by downloading them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verified-assets"
          gh release download "$RELEASE_TAG" --pattern "Motion2Video-${RELEASE_TAG#v}-Dark.apk" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/verified-assets"
          cd "$RUNNER_TEMP/verified-assets"
          sha256sum --check SHA256SUMS.txt --ignore-missing
