name: Build and audit Android APK
on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: python3 tools/audit_source.py
      - run: python3 tools/verify_dependencies.py
      - run: python3 tools/test_supply_chain.py
      - run: npm ci --ignore-scripts
      - name: npm vulnerability audit (includes development tools)
        run: npm audit --audit-level=high
      - run: npm run test:ui
      - run: npm run test:clock
      - run: python3 tools/test_yuv.py
      - run: python3 tools/test_platform.py
      - run: python3 tools/test_input.py
      - run: python3 tools/test_privacy.py
      - run: python3 tools/test_features.py
      - run: python3 tools/test_fonts.py
      - run: python3 tools/verify_privacy.py
      - run: python3 build.py
      - run: python3 build.py --release
      - run: python3 tools/verify_phase2.py
      - run: python3 tools/verify_privacy.py --apks
      - run: python3 tools/verify_release.py --directory dist
      - name: Resolve actual native dependencies for OWASP scan
        run: ./gradlew --no-daemon :app:copySecurityDependencies
      - name: Prepare contributor artifact with its own checksum inventory
        run: |
          mkdir -p build/debug-artifact
          cp dist/*-Dark.apk build/debug-artifact/
          python3 tools/checksums.py generate build/debug-artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Motion2Video-Dark-debug
          path: build/debug-artifact/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-inputs
          path: build/security-dependencies/
          if-no-files-found: error
          retention-days: 1
  dependency-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dependency-audit-inputs
          path: build/security-dependencies/
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/odc-data
          key: odc-linux-13-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: odc-linux-13-v1-
      - name: OWASP Dependency-Check (CVSS 7+, errors fail the job)
        env:
          M2V_ODC_DATA: ${{ runner.temp }}/odc-data
          NVD_API_KEY: ${{ github.event_name != 'pull_request' && secrets.NVD_API_KEY || '' }}
        run: python3 tools/dependency_scan.py
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: success() && github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/odc-data
          key: odc-linux-13-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-check-report
          path: tools/dependency-check/build/reports/dependency-check/
          retention-days: 14
