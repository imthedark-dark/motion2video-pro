name: Build and audit Android APK
on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: python3 tools/audit_source.py
      - run: python3 tools/verify_dependencies.py
      - run: python3 tools/test_supply_chain.py
      - run: npm ci --ignore-scripts
      - name: npm vulnerability audit (includes development tools)
        run: npm audit --audit-level=high
      - run: npm run test:ui
      - run: npm run test:clock
      - run: python3 tools/test_yuv.py
      - run: python3 tools/test_platform.py
      - run: python3 tools/test_input.py
      - run: python3 tools/test_privacy.py
      - run: python3 tools/test_features.py
      - run: python3 tools/test_fonts.py
      - run: python3 tools/verify_privacy.py
      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug
      - run: python3 build.py
      - run: python3 build.py --release
      - run: python3 tools/verify_phase2.py
      - run: python3 tools/verify_privacy.py --apks
      - run: python3 tools/verify_release.py --directory dist
      - name: Resolve actual native dependencies for OWASP scan
        run: ./gradlew --no-daemon :app:copySecurityDependencies
      - name: Stage the verified debug APK
        run: |
          mkdir -p build/debug-artifact
          cp dist/*-Dark.apk build/debug-artifact/
      - name: Sign contributor artifact with the test identity when configured
        # Same-repository PR code is trusted here to the same extent as a branch push.
        # No signing secret is passed to fork PRs or pull_request_target events.
        env:
          TEST_KEYSTORE_B64: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.M2V_TEST_KEYSTORE_B64 || '' }}
          TEST_STORE_PASSWORD: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.M2V_TEST_STORE_PASSWORD || '' }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          apks=(build/debug-artifact/*-Dark.apk)
          [[ ${#apks[@]} == 1 && -f "${apks[0]}" ]]
          apk=${apks[0]}
          tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ -n "$TEST_KEYSTORE_B64" && -n "$TEST_STORE_PASSWORD" ]]; then
            # Only ever replace the signer on the staged, debuggable copy.
            "$tools/aapt" dump badging "$apk" | grep -Fx 'application-debuggable' >/dev/null
            umask 077
            keyfile=$(mktemp "$RUNNER_TEMP/m2v-test.XXXXXXXX")
            trap 'rm -f -- "$keyfile"' EXIT
            printf '%s' "$TEST_KEYSTORE_B64" | base64 --decode > "$keyfile"
            unset TEST_KEYSTORE_B64
            "$tools/apksigner" sign --ks "$keyfile" --ks-key-alias m2v-test \
              --ks-pass env:TEST_STORE_PASSWORD --key-pass env:TEST_STORE_PASSWORD \
              --v4-signing-enabled false "$apk"
            mode='Stable test signer. Compatible test installs can update in place.'
          else
            mode='Fresh runner debug signer. Test secrets were unavailable or incomplete. Its signature may differ from previous test builds.'
          fi
          fingerprint=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [[ "$fingerprint" =~ ^[a-fA-F0-9]{64}$ ]]
          printf '%s\n\nPublic signing certificate SHA-256: `%s`\n' "$mode" "$fingerprint" >> "$GITHUB_STEP_SUMMARY"
      - name: Checksum the final contributor artifact
        run: python3 tools/checksums.py generate build/debug-artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Motion2Video-Dark-debug
          path: build/debug-artifact/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-inputs
          path: build/security-dependencies/
          if-no-files-found: error
          retention-days: 1
  dependency-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dependency-audit-inputs
          path: build/security-dependencies/
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/odc-data
          key: odc-linux-13-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: odc-linux-13-v1-
      - name: OWASP Dependency-Check (CVSS 7+, errors fail the job)
        env:
          M2V_ODC_DATA: ${{ runner.temp }}/odc-data
          NVD_API_KEY: ${{ github.event_name != 'pull_request' && secrets.NVD_API_KEY || '' }}
        run: python3 tools/dependency_scan.py
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: success() && github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/odc-data
          key: odc-linux-13-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-check-report
          path: tools/dependency-check/build/reports/dependency-check/
          retention-days: 14
