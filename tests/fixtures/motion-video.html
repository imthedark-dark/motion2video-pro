<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Motion Video | Professional</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Vazirmatn:wght@300;500;700;900&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #05050a;
    color: #fff;
    font-family: 'Vazirmatn', sans-serif;
    overflow: hidden;
    height: 100vh;
    cursor: none;
  }

  /* Custom Cursor */
  .cursor {
    width: 20px;
    height: 20px;
    border: 2px solid #00f0ff;
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s, border-color 0.2s;
    mix-blend-mode: difference;
  }
  .cursor-follower {
    width: 8px;
    height: 8px;
    background: #ff00aa;
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
  }

  /* Canvas for particles */
  #particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* Main Stage */
  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    overflow: hidden;
  }

  /* Glow Background */
  .glow {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(0,240,255,0.15) 0%, transparent 70%);
    border-radius: 50%;
    filter: blur(40px);
    animation: pulseGlow 6s ease-in-out infinite;
    z-index: 0;
  }

  @keyframes pulseGlow {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.3); opacity: 1; }
  }

  /* Timeline / Progress */
  .timeline {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    max-width: 500px;
    height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
    z-index: 20;
  }
  .timeline-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00f0ff, #ff00aa);
    border-radius: 10px;
    transition: width 0.1s linear;
  }

  /* Scene Container */
  .scene {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
  }

  .scene.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* Text Styles */
  .big-title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(3rem, 10vw, 8rem);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: linear-gradient(135deg, #00f0ff, #ff00aa, #00f0ff);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientShift 4s ease infinite;
    text-shadow: 0 0 40px rgba(0,240,255,0.3);
    opacity: 0;
    transform: translateY(40px);
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .subtitle {
    font-size: clamp(1rem, 3vw, 1.6rem);
    font-weight: 300;
    letter-spacing: 0.4em;
    color: rgba(255,255,255,0.7);
    margin-top: 1.5rem;
    opacity: 0;
    transform: translateY(20px);
  }

  .persian-text {
    font-size: clamp(1.2rem, 3.5vw, 2rem);
    font-weight: 500;
    color: #fff;
    margin-top: 2rem;
    opacity: 0;
    transform: translateY(20px);
  }

  /* Glitch Effect */
  .glitch {
    position: relative;
  }
  .glitch::before,
  .glitch::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0.8;
  }
  .glitch::before {
    color: #00f0ff;
    animation: glitch1 2.5s infinite linear alternate-reverse;
  }
  .glitch::after {
    color: #ff00aa;
    animation: glitch2 2.5s infinite linear alternate-reverse;
  }

  @keyframes glitch1 {
    0% { clip-path: inset(20% 0 80% 0); transform: translate(-3px, -1px); }
    20% { clip-path: inset(60% 0 10% 0); transform: translate(3px, 1px); }
    40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
    60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
    80% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); }
    100% { clip-path: inset(30% 0 40% 0); transform: translate(1px, -1px); }
  }
  @keyframes glitch2 {
    0% { clip-path: inset(10% 0 70% 0); transform: translate(2px, 1px); }
    20% { clip-path: inset(50% 0 20% 0); transform: translate(-3px, -1px); }
    40% { clip-path: inset(30% 0 50% 0); transform: translate(1px, 2px); }
    60% { clip-path: inset(70% 0 10% 0); transform: translate(-2px, 1px); }
    80% { clip-path: inset(20% 0 60% 0); transform: translate(3px, -2px); }
    100% { clip-path: inset(40% 0 30% 0); transform: translate(-1px, 1px); }
  }

  /* Floating shapes */
  .shape {
    position: absolute;
    border: 1px solid rgba(0,240,255,0.3);
    border-radius: 50%;
    animation: float 12s infinite ease-in-out;
  }
  .shape:nth-child(1) { width: 300px; height: 300px; top: 10%; left: 5%; animation-delay: 0s; }
  .shape:nth-child(2) { width: 180px; height: 180px; bottom: 15%; right: 10%; animation-delay: -3s; border-color: rgba(255,0,170,0.3); }
  .shape:nth-child(3) { width: 120px; height: 120px; top: 40%; right: 20%; animation-delay: -6s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    33% { transform: translate(30px, -40px) rotate(120deg); }
    66% { transform: translate(-20px, 20px) rotate(240deg); }
  }

  /* Controls */
  .controls {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    z-index: 30;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .controls.show {
    opacity: 1;
  }
  .btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    padding: 12px 28px;
    border-radius: 50px;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 0.95rem;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.3s;
    letter-spacing: 1px;
  }
  .btn:hover {
    background: rgba(0,240,255,0.15);
    border-color: #00f0ff;
    box-shadow: 0 0 20px rgba(0,240,255,0.3);
    transform: translateY(-2px);
  }

  /* Final CTA */
  .cta {
    margin-top: 3rem;
    opacity: 0;
    transform: scale(0.9);
  }
  .cta a {
    display: inline-block;
    padding: 16px 48px;
    background: linear-gradient(135deg, #00f0ff, #ff00aa);
    color: #000;
    font-weight: 700;
    font-size: 1.1rem;
    border-radius: 50px;
    text-decoration: none;
    letter-spacing: 2px;
    box-shadow: 0 0 40px rgba(0,240,255,0.4);
    transition: all 0.3s;
  }
  .cta a:hover {
    transform: scale(1.05);
    box-shadow: 0 0 60px rgba(255,0,170,0.5);
  }

  /* Scanline overlay */
  .scanlines {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      to bottom,
      transparent 50%,
      rgba(0,0,0,0.05) 50%
    );
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 50;
    opacity: 0.4;
  }

  /* Vignette */
  .vignette {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 40;
  }
</style>
</head>
<body>
  <div class="cursor"></div>
  <div class="cursor-follower"></div>
  <canvas id="particles"></canvas>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="stage">
    <div class="glow"></div>
    
    <!-- Decorative shapes -->
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>

    <!-- Scene 1: Intro -->
    <div class="scene" id="scene1">
      <h1 class="big-title glitch" data-text="MOTION">MOTION</h1>
      <p class="subtitle">CINEMA • DESIGN • FUTURE</p>
    </div>

    <!-- Scene 2 -->
    <div class="scene" id="scene2">
      <h1 class="big-title" style="font-size: clamp(2.5rem, 8vw, 6rem);">BEYOND</h1>
      <p class="persian-text">فراتر از محدودیت‌ها</p>
    </div>

    <!-- Scene 3 -->
    <div class="scene" id="scene3">
      <h1 class="big-title" style="font-size: clamp(2rem, 7vw, 5.5rem);">CREATE</h1>
      <p class="subtitle">THE IMPOSSIBLE</p>
      <p class="persian-text">خلق چیزهایی که دیگران فقط تصور می‌کنند</p>
    </div>

    <!-- Scene 4: Final -->
    <div class="scene" id="scene4">
      <h1 class="big-title" style="font-size: clamp(2.2rem, 7vw, 5rem);">READY?</h1>
      <p class="persian-text">وقتشه که حرکت کنی</p>
      <div class="cta">
        <a href="#" onclick="restart(); return false;">▶ دوباره پخش</a>
      </div>
    </div>

    <!-- Timeline -->
    <div class="timeline">
      <div class="timeline-fill" id="progress"></div>
    </div>

    <!-- Controls -->
    <div class="controls" id="controls">
      <button class="btn" onclick="restart()">شروع مجدد</button>
      <button class="btn" id="pauseBtn" onclick="togglePause()">توقف</button>
    </div>
  </div>

<script>
  // Custom Cursor
  const cursor = document.querySelector('.cursor');
  const follower = document.querySelector('.cursor-follower');
  let mouseX = 0, mouseY = 0;
  let followerX = 0, followerY = 0;

  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    cursor.style.left = mouseX + 'px';
    cursor.style.top = mouseY + 'px';
  });

  function animateFollower() {
    followerX += (mouseX - followerX) * 0.15;
    followerY += (mouseY - followerY) * 0.15;
    follower.style.left = followerX + 'px';
    follower.style.top = followerY + 'px';
    requestAnimationFrame(animateFollower);
  }
  animateFollower();

  // Particles
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  class Particle {
    constructor() {
      this.reset();
    }
    reset() {
      this.x = Math.random() * w;
      this.y = Math.random() * h;
      this.size = Math.random() * 2 + 0.5;
      this.speedX = (Math.random() - 0.5) * 0.8;
      this.speedY = (Math.random() - 0.5) * 0.8;
      this.opacity = Math.random() * 0.5 + 0.1;
      this.color = Math.random() > 0.5 ? '0,240,255' : '255,0,170';
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      if (this.x < 0 || this.x > w || this.y < 0 || this.y > h) this.reset();
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${this.color},${this.opacity})`;
      ctx.fill();
    }
  }

  for (let i = 0; i < 120; i++) {
    particles.push(new Particle());
  }

  function animateParticles() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.update();
      p.draw();
    });
    // Connect nearby particles
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          ctx.beginPath();
          ctx.strokeStyle = `rgba(0,240,255,${0.08 * (1 - dist / 120)})`;
          ctx.lineWidth = 0.5;
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  // Timeline / Scenes
  const scenes = [
    document.getElementById('scene1'),
    document.getElementById('scene2'),
    document.getElementById('scene3'),
    document.getElementById('scene4')
  ];
  const progressBar = document.getElementById('progress');
  const controls = document.getElementById('controls');
  const pauseBtn = document.getElementById('pauseBtn');

  let currentScene = 0;
  let startTime = null;
  let paused = false;
  let pauseStart = 0;
  let totalPaused = 0;
  const sceneDuration = 3500; // ms per scene
  const totalDuration = sceneDuration * scenes.length;

  function showScene(index) {
    scenes.forEach((s, i) => {
      s.classList.remove('active');
      // Reset animations
      const titles = s.querySelectorAll('.big-title, .subtitle, .persian-text, .cta');
      titles.forEach(el => {
        el.style.opacity = '0';
        el.style.transform = el.classList.contains('cta') ? 'scale(0.9)' : 'translateY(30px)';
      });
    });

    const scene = scenes[index];
    scene.classList.add('active');

    // Animate in
    setTimeout(() => {
      const title = scene.querySelector('.big-title');
      if (title) {
        title.style.transition = 'all 1s cubic-bezier(0.16, 1, 0.3, 1)';
        title.style.opacity = '1';
        title.style.transform = 'translateY(0)';
      }
    }, 100);

    setTimeout(() => {
      const sub = scene.querySelector('.subtitle');
      if (sub) {
        sub.style.transition = 'all 0.9s cubic-bezier(0.16, 1, 0.3, 1)';
        sub.style.opacity = '1';
        sub.style.transform = 'translateY(0)';
      }
    }, 400);

    setTimeout(() => {
      const per = scene.querySelector('.persian-text');
      if (per) {
        per.style.transition = 'all 0.9s cubic-bezier(0.16, 1, 0.3, 1)';
        per.style.opacity = '1';
        per.style.transform = 'translateY(0)';
      }
    }, 600);

    setTimeout(() => {
      const cta = scene.querySelector('.cta');
      if (cta) {
        cta.style.transition = 'all 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
        cta.style.opacity = '1';
        cta.style.transform = 'scale(1)';
      }
    }, 900);
  }

  function update() {
    if (paused) {
      requestAnimationFrame(update);
      return;
    }

    if (!startTime) startTime = performance.now();
    const elapsed = performance.now() - startTime - totalPaused;
    const progress = Math.min(elapsed / totalDuration, 1);
    progressBar.style.width = (progress * 100) + '%';

    const sceneIndex = Math.min(Math.floor(elapsed / sceneDuration), scenes.length - 1);
    
    if (sceneIndex !== currentScene) {
      currentScene = sceneIndex;
      showScene(currentScene);
    }

    if (progress >= 1) {
      controls.classList.add('show');
      return;
    }

    requestAnimationFrame(update);
  }

  function restart() {
    currentScene = 0;
    startTime = null;
    totalPaused = 0;
    paused = false;
    pauseBtn.textContent = 'توقف';
    controls.classList.remove('show');
    progressBar.style.width = '0%';
    showScene(0);
    requestAnimationFrame(update);
  }

  function togglePause() {
    if (paused) {
      totalPaused += performance.now() - pauseStart;
      paused = false;
      pauseBtn.textContent = 'توقف';
      requestAnimationFrame(update);
    } else {
      pauseStart = performance.now();
      paused = true;
      pauseBtn.textContent = 'ادامه';
    }
  }

  // Start
  showScene(0);
  requestAnimationFrame(update);

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      togglePause();
    }
    if (e.code === 'KeyR') restart();
  });
</script>
</body>
</html>
