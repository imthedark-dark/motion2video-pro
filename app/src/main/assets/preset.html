<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#111;color:#f3efea;font-family:sans-serif}#stage{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;display:grid;place-content:center}h1{margin:0;font-size:13vw;font-weight:900;letter-spacing:-.05em}.badge{font-size:3vw;letter-spacing:.2em;color:#ffb800;text-align:center}#ball{position:absolute;left:45%;top:35%;width:10vw;height:10vw;border-radius:50%;background:#ff3b00}#words{visibility:hidden;text-align:center}#end{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;background:#f3efea;color:#111;display:grid;place-content:center;transform:translateX(110%)}#end b{color:#ff3b00}</style></head><body><div id="stage"><div id="ball"></div><div id="words"><h1>MAKE IT<br>MOVE.</h1><div class="badge">MOTION / 60</div></div><div id="end"><h1>MOTION<br><b>REEL '26</b></h1></div></div><script>window.addEventListener('load',()=>{window.motionTimeline=gsap.timeline();motionTimeline.from('#ball',{y:-250,duration:.7,ease:'bounce.out'},0).to('#ball',{scale:22,duration:1,ease:'expo.inOut'},2).set('#words',{visibility:'visible'},3).from('#words h1',{y:100,opacity:0,duration:1,ease:'expo.out'},3).to('#words',{rotation:3,scale:1.05,duration:2,yoyo:true,repeat:1},5).to('#end',{x:0,xPercent:0,duration:1,ease:'expo.inOut'},11).to({},{duration:2},12);});</script></body></html>
